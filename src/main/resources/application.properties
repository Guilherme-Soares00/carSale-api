spring.application.name=carsale-api
spring.profiles.default=dev
spring.datasource.url=jdbc:h2:mem:carsale;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
app.security.bcrypt-strength=12
app.cors.allowed-origins=${CARSALE_ALLOWED_ORIGINS:http://localhost:3000}
